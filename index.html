<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>B1 Word Lab</title>
  <meta name="description" content="Vocabulary, grammar, stories and topics from my British Council B1 course, with B1 definitions and scratch-to-reveal translations.">
  <meta name="theme-color" content="#5b4bff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app2.css?v=7">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%235b4bff'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>B1</text></svg>">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open sessions menu" aria-controls="drawer" aria-expanded="false">
      <span class="burger" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <a class="brand" href="#/" aria-label="Home">
      <span class="brand-mark">B1</span>
      <span class="brand-text">Word Lab</span>
    </a>
    <nav class="mainnav" aria-label="Main">
      <a href="#/" data-nav="home">Sessions</a>
      <a href="#/review" data-nav="review">Review</a>
      <a href="#/grammar" data-nav="grammar">Grammar</a>
      <a href="#/stories" data-nav="stories">Stories</a>
      <a href="#/topics" data-nav="topics">Topics</a>
    </nav>
    <div class="top-tools">
      <label class="lang-pick" title="Translation language">
        <span class="sr">Translation language</span>
        <select id="langSelect"></select>
      </label>
      <button class="icon-btn" id="themeBtn" aria-label="Switch light/dark theme">◐</button>
    </div>
  </header>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Sessions menu">
    <div class="drawer-search">
      <span aria-hidden="true">🔎</span>
      <input id="drawerFilter" type="search" placeholder="Find a session…" aria-label="Find a session" autocomplete="off">
    </div>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>

  <main id="view" tabindex="-1"></main>

  <nav class="bottomnav" aria-label="Main (mobile)">
    <a href="#/" data-nav="home"><span>🏠</span>Sessions</a>
    <a href="#/review" data-nav="review"><span>🔁</span>Review</a>
    <a href="#/grammar" data-nav="grammar"><span>🧩</span>Grammar</a>
    <a href="#/stories" data-nav="stories"><span>📖</span>Stories</a>
    <a href="#/topics" data-nav="topics"><span>🎬</span>Topics</a>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <button class="icon-btn sheet-close" data-close aria-label="Close">✕</button>
      <div class="sheet-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="js/course-data.js?v=7"></script>
  <script src="js/app2.js?v=7"></script>
</body>
</html>
